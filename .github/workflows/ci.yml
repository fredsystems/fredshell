name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Nix devShell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: false

      - name: Run checks in devShell
        env:
          # `no-commit-to-branch` exists to stop developers committing
          # directly to `main`. On a `push` to `main` the checked-out
          # branch IS `main`, so the hook fails by construction and says
          # nothing about the commit's quality. Skip it for that event
          # only — `pull_request` and `merge_group` runs check out a
          # detached merge commit, so the hook still passes there and the
          # local pre-commit hook still enforces the rule for developers.
          SKIP: ${{ github.event_name == 'push' && 'no-commit-to-branch' || '' }}
        run: |
          nix develop --impure --command bash -e -c '
            set -euxo pipefail
            pre-commit run --all-files
          '

  check:
    name: Check ${{ matrix.os }} ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["stable", "nightly"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.toolchain }}
          # `cargo xtask check` runs `cargo fmt` and `cargo clippy`,
          # whose components are not in the default nightly profile.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `cargo xtask check` invokes `cargo-machete` as part of the
      # mandatory verification suite. The bare runner has no nix
      # devShell, so install it explicitly here.
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-machete
      - run: cargo xtask check

  compat:
    name: Spec compat report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
          use-gha-cache: false

      - name: Run cargo xtask compat
        run: |
          nix develop --impure --command bash -e -c '
            set -euxo pipefail
            mkdir -p target
            cargo xtask compat --json target/compat.json
          '

      - name: Upload compat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-report
          path: target/compat.json
          if-no-files-found: error
          retention-days: 30

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - nix-checks
      - check
      - compat
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.nix-checks.result }}" != "success" ]]; then
            echo "nix-checks failed"; exit 1
          fi
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "check matrix failed"; exit 1
          fi
          if [[ "${{ needs.compat.result }}" != "success" ]]; then
            echo "compat failed"; exit 1
          fi
          echo "All CI jobs succeeded"
